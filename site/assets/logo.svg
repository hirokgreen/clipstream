<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Stream 1 Gradient -->
    <linearGradient id="stream1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Stream 2 Gradient -->
    <linearGradient id="stream2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="metalClip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="streamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Shadow / Canvas -->
  <g filter="url(#softShadow)">
    <!-- Continuous Curvature macOS Squircle Base -->
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  </g>

  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="180" r="160" fill="#4F46E5" opacity="0.22" filter="blur(40px)" />
  <circle cx="340" cy="340" r="120" fill="#06B6D4" opacity="0.2" filter="blur(50px)" />

  <!-- Clipboard Board (Frosted Glass Panel) -->
  <g transform="translate(106, 96)">
    <!-- Board Base -->
    <rect x="0" y="24" width="300" height="340" rx="26" ry="26" fill="url(#glassFill)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />
    
    <!-- Inner subtle border highlight -->
    <rect x="1.5" y="25.5" width="297" height="337" rx="24.5" ry="24.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Flowing Stream Wave 1 -->
    <path d="M-20,130 C60,110 120,170 200,140 C260,115 300,165 340,150" 
          fill="none" stroke="url(#stream1)" stroke-width="18" stroke-linecap="round" filter="url(#streamGlow)" opacity="0.95" />
    
    <!-- Flowing Stream Wave 2 -->
    <path d="M-30,200 C50,170 110,235 180,205 C250,175 280,240 335,215" 
          fill="none" stroke="url(#stream2)" stroke-width="14" stroke-linecap="round" filter="url(#streamGlow)" opacity="0.85" />

    <!-- Flowing Stream Wave 3 (Accent Pulse) -->
    <path d="M-10,265 C70,240 130,290 190,270 C250,250 290,295 330,280" 
          fill="none" stroke="url(#stream1)" stroke-width="9" stroke-linecap="round" opacity="0.75" />

    <!-- Code/Text Stream Bar 1 -->
    <rect x="36" y="80" width="110" height="10" rx="5" fill="#38BDF8" opacity="0.85" />
    <rect x="156" y="80" width="45" height="10" rx="5" fill="#A855F7" opacity="0.65" />

    <!-- Code/Text Stream Bar 2 -->
    <rect x="36" y="105" width="70" height="8" rx="4" fill="rgba(255,255,255,0.4)" />
    <rect x="116" y="105" width="90" height="8" rx="4" fill="rgba(255,255,255,0.25)" />

    <!-- Code/Text Stream Bar 3 -->
    <rect x="36" y="310" width="140" height="8" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="186" y="310" width="40" height="8" rx="4" fill="#38BDF8" opacity="0.7" />

    <!-- Metallic Spring Clip Assembly at Top -->
    <g transform="translate(75, 0)">
      <!-- Clip Base Block -->
      <rect x="15" y="12" width="120" height="30" rx="8" fill="url(#metalClip)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
      <!-- Clip Rivet / Pivot -->
      <circle cx="75" cy="27" r="7" fill="#475569" stroke="#94A3B8" stroke-width="1.5" />
      <circle cx="75" cy="27" r="3" fill="#E2E8F0" />
      <!-- Top Wire Loop Handle -->
      <path d="M45,14 L45,-6 C45,-14 55,-22 75,-22 C95,-22 105,-14 105,-6 L105,14" 
            fill="none" stroke="url(#metalClip)" stroke-width="9" stroke-linecap="round" />
    </g>

    <!-- Speed/Stream Floating Sparkles -->
    <circle cx="230" cy="138" r="4" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 0 6px #38BDF8)" />
    <circle cx="100" cy="225" r="3" fill="#38BDF8" opacity="0.8" filter="drop-shadow(0 0 5px #38BDF8)" />
    <circle cx="265" cy="272" r="3.5" fill="#C084FC" opacity="0.85" filter="drop-shadow(0 0 5px #C084FC)" />
  </g>
</svg>
